<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spotlight visual experiment</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
        font-family: Arial, sans-serif;
      }

      .scene {
        position: relative;
        width: 100vw;
        height: 100vh;
      }

      .lamp {
        position: absolute;
        top: 0;
        left: 50%;
        width: 3px;
        height: 60px;
        background: #222;
      }

      .bulb {
        position: absolute;
        top: 48px;
        left: 50%;
        width: 28px;
        height: 38px;
        transform: translateX(-50%);
        border-radius: 50%;
        background: #ffd76a;
        box-shadow:
          0 0 25px #ffd76a,
          0 0 70px rgb(255 215 106 / 50%);
      }

      .light {
        position: absolute;
        top: 65px;
        left: 50%;
        width: 1750px;
        height: 650px;
        transform: translateX(-50%);
        background: linear-gradient(
          to bottom,
          rgb(255 215 106 / 45%),
          rgb(255 215 106 / 25%) 55%,
          transparent
        );
        clip-path: polygon(50% 0, 100% 100%, 0 100%);
        filter: blur(4px);
      }

      .text {
        position: absolute;
        top: 42%;
        left: 50%;
        padding: 32px 42px;
        transform: translate(-50%, -50%);
        color: #050505;
        font-size: clamp(32px, 4vw, 64px);
        font-weight: 700;
        line-height: 1;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main class="scene">
      <div class="lamp" aria-hidden="true"><div class="bulb"></div></div>
      <div class="light" aria-hidden="true"></div>
      <p class="text">Only what<br />needs to be seen.</p>
    </main>
  </body>
</html>
