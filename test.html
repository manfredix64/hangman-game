<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Spotlight</title>

<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: Arial, sans-serif;
  }

  .scene {
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  /* Lamp */
  .lamp {
    position: absolute;
    top: 0;
    left: 25%;
    width: 3px;
    height: 80px;
    background: #222;
  }

  .bulb {
    position: absolute;
    top: 68px;
    left: 50%;
    width: 28px;
    height: 38px;
    transform: translateX(-50%);
    border-radius: 50%;
    background: #ffd76a;
    box-shadow: 0 0 25px #ffd76a, 0 0 60px rgba(255, 215, 106, .4);
  }

  /* Light */
  .light {
    position: absolute;
    top: 85px;
    /* left: calc(25% - 90px); */
    left: 11.065%;
    width: 360px;
    height: 650px;
    background: linear-gradient(
      to bottom,
      rgba(255, 215, 106, .28),
      rgba(255, 215, 106, .07) 55%,
      transparent
    );
    clip-path: polygon(50% 0, 100% 100%, 0 100%);
    filter: blur(4px);
  }

  /* Text */
  .text {
    position: absolute;
    top: 42%;
    left: 25%;
    transform: translate(-50%, -50%);
    color: #050505;
    /* background: rgba(255, 230, 160, .72); */
    padding: 32px 42px;
    font-size: clamp(32px, 4vw, 64px);
    line-height: 1;
    font-weight: 700;
    text-align: center;
  }
</style>
</head>

<body>
  <div class="scene">

    <div class="lamp">
      <div class="bulb"></div>
    </div>

    <div class="light"></div>

    <div class="text">
      Only what<br>
      needs to be seen.
    </div>

  </div>
</body>
</html>
